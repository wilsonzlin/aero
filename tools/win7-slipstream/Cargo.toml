[package]
name = "aero-win7-slipstream"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.102"
base64 = "0.23.0"
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
walkdir = "2.5.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
which = "8.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
